pipeline:
  source:
    camera_id: camera-01
    mode: file
    uri: videos/reliability/paris_city_walk.mp4
queues:
  model_input_capacity: 4
  overflow_policy: block
event_frames:
  enabled: true
  jpeg_quality: 88
  minimum_confidence: 0.65
kafka:
  bootstrap_servers: kafka:9092
  topics:
    yolo11n-person: yolo11n-person-results
  publisher:
    queue_maxsize: 128
    max_batch_messages: 32
    batch_flush_interval_ms: 100
    enqueue_timeout_seconds: 5.0
    produce_retry_seconds: 120.0
    shutdown_timeout_seconds: 30.0
    producer:
      acks: all
      enable.idempotence: true
      compression.type: lz4
      linger.ms: 10
      batch.size: 65536
      message.timeout.ms: 120000
      request.timeout.ms: 30000
      socket.keepalive.enable: true
  results_consumer:
    group_id: deepstream-results-processor
    auto_offset_reset: earliest
    poll_timeout_seconds: 0.5
    session_timeout_ms: 45000
    max_poll_interval_ms: 900000
  batch_processing:
    batch_size: 100
    flush_interval_ms: 50
    queue_capacity: 300
    retry_attempts: 3
    retry_backoff_ms: 250
    shutdown_timeout_seconds: 180
  dead_letter:
    topic: inference-dead-letter
    flush_timeout_seconds: 15
  kafka_admin:
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000
    request_timeout_seconds: 30
database:
  host: host.docker.internal
  port: 5432
  dbname: ai_monitoring
  user: ai_app
  password_env: DATABASE_PASSWORD
  connect_timeout: 5
yolo:
  model_id: yolo11n-person
  source: videos/reliability/paris_city_walk.mp4
  weights: artifacts/models/yolo11n.pt
  gpu_id: 0
  image_size: 640
  confidence: 0.35
  iou: 0.45
  classes:
  - 0
  quantize: 16
  max_detections: 300
tensorrt_pipeline:
  engine: artifacts/models/yolo11n_fp16.engine
  onnx: artifacts/models/yolo11n.onnx
  batch_width: 1920
  batch_height: 1080
  sample_fps: 8.0
  fallback_source_fps: 60.0
  detection_class: person
  execution_mode: person-only
  event_every_nth_sample: 1
  event_type: person_detected
  result_root: artifacts/results/yolo11n-person
  workspace_gib: 2
  verification_timeout_seconds: 90
  processor_startup_timeout_seconds: 60
object_store:
  endpoint: http://object-store:9000
  host_endpoint: http://127.0.0.1:9000
  access_key: camera-store
  region: us-east-1
  password_env: OBJECT_STORE_PASSWORD
database_timeout_seconds: 300
metrics_directory: artifacts/benchmarks
