
syntax = "proto3";

package ai_monitoring;

// One detection produced by an AI model.
message Detection {
    int32 class_id = 1;
    string class_name = 2;
    float confidence = 3;

    // Normalized coordinates: x1, y1, x2, y2.
    repeated float bbox_normalized = 4;

    bool synthetic = 5;

    // Person number inside this frame. 1 is the highest confidence.
    // Empty for a detection that is not a person. The model does not
    // follow the same person into the next frame.
    string person_id = 6;
}

// Individual inference stage timing.
message StageTiming {
    string stage = 1;
    double duration_ms = 2;
}

message InferenceResult {

    // Existing backend fields: preserve their numbers.
    string camera_id = 1;
    string frame_id = 2;
    string model_id = 3;
    int64 processed_at_ms = 4;
    string status = 5;

    bool is_event = 6;
    string event_type = 7;

    string storage_key = 8;
    string image_format = 9;
    int64 image_size_bytes = 10;
    string image_sha256 = 11;

    int64 captured_at_ms = 12;

    // New DeepStream integration fields.
    string source_session_id = 13;
    string result_id = 14;
    string worker_id = 15;

    uint64 frame_sequence = 16;

    uint32 gpu_id = 17;
    uint32 frame_width = 18;
    uint32 frame_height = 19;
    uint32 model_input_size = 20;

    repeated Detection detections = 21;
    repeated StageTiming timings = 22;

    string schema_version = 23;
    string event_storage_root = 24;
    string boxed_key = 25;
    uint64 boxed_bytes = 26;
    string boxed_sha256 = 27;
    double source_video_ms = 28;

    // Revision applied to this frame. 0 means the producer predates this field.
    // schema_version stays an independent contract version.
    uint32 camera_config_version = 29;

    // Model class that qualified this frame, such as "person".
    // Empty on messages encoded before this field existed.
    string event = 30;
    // Confidence of person_id. 0 means the producer did not send it.
    float confidence = 31;
    // Legacy frame-local ordinal such as "6090:1". Not a detection index.
    string person_id = 32;

    // Zero-based index into detections. Absent means unknown.
    // Zero is a real detection and must not be used as the unknown marker.
    optional int32 primary_detection_index = 33;
    string primary_class = 34;
    float primary_confidence = 35;
    // SHA-256 of the TensorRT engine file loaded for this result. Empty if unknown.
    string engine_digest = 36;
}
