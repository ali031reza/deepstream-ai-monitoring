name: Configuration and Python syntax

on:
  pull_request:
  push:
    branches: [DeepStream_Pipeline, "refactor/**"]

jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q configs src
      - name: Run CPU-only configuration tests
        run: python -m pytest -q tests/test_configuration.py
